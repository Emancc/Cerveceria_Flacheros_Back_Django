databases:
  - name: cerveceria-flacheros-db
    plan: free

services:
  - type: web
    name: cerveceria-flacheros-backend
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: bash bash.sh
    healthCheckPath: /api/schema/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: cerveceria-flacheros-back-django-1.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: cerveceria-flacheros-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://flacheros-frontend.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://flacheros-frontend.vercel.app
